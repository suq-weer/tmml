[package]
name = "too-many-minecraft-launcher"
version = "0.1.0"
description = "A Tauri Minecraft Launcher."
authors = ["Xiaosuoaa"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tmml_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
system-theme = "0.3.0"
zip = "8.6.0"
reqwest = { version = "0.13.4", features = ["json", "stream", "gzip"] }
tokio = { version = "1.53.1", features = ["full", "test-util"] }
futures-util = "0.3.33"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "ansi"] }
time = { version = "0.3.55", features = ["formatting", "macros", "local-offset"] }
tauri-plugin-fs = "2"
portable-pty = "0.8"
directories = "6.0.0"
tauri-plugin-tracing = "0.3.4"
sha1 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
png = "0.17"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
